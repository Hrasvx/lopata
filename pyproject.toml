[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lopata"
version = "1.2.1"
description = "CLI defensive web vulnerability scanner for authorized testing (Alpine Linux)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lopata" }]
keywords = ["security", "scanner", "web", "vulnerability", "pentest", "defensive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "requests[socks]>=2.28",
    "httpx[socks]>=0.24",
    "beautifulsoup4>=4.11",
    "rich>=13.0",
    "reportlab>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.3"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
lopata = "lopata.cli:main"

# Third-party checks/integrations register here; each value points at a module
# whose register() returns a lopata.core.plugins.Plugin. Built-ins are found by
# package-walking and need not be listed. See "Writing a plugin" in the README.
# [project.entry-points."lopata.plugins"]
# my-check = "mypkg.mycheck"

[tool.setuptools]
packages = [
    "lopata",
    "lopata.core",
    "lopata.integrations",
    "lopata.modules",
    "lopata.report",
]
