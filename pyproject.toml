[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lopata"
version = "1.0.0"
description = "CLI defensive web vulnerability scanner for authorized testing (Alpine Linux)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lopata" }]
keywords = ["security", "scanner", "web", "vulnerability", "pentest", "defensive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "rich>=13.0",
    "reportlab>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.3"]

[project.scripts]
lopata = "lopata.cli:main"

[tool.setuptools]
packages = [
    "lopata",
    "lopata.core",
    "lopata.integrations",
    "lopata.modules",
    "lopata.report",
]
